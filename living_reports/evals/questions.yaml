# Test set for cost per correct answer. Correct means the same result as expected_query.
- {question: "What is the total fraud loss?", expected_kind: report, expected_query: {metrics: [fraud_loss]}}
- {question: "How many orders do we have?", expected_kind: report, expected_query: {metrics: [order_count]}}
- {question: "What is the overall fraud rate?", expected_kind: report, expected_query: {metrics: [fraud_rate]}}
- {question: "What is the total order value?", expected_kind: report, expected_query: {metrics: [order_value]}}
- {question: "Where is fraud loss concentrated by sales channel?", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [orders.sales_channel]}}
- {question: "Show fraud rate by sales channel.", expected_kind: report, expected_query: {metrics: [fraud_rate], dimensions: [orders.sales_channel]}}
- {question: "Which region has the most fraud loss?", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [dealers.region]}}
- {question: "Break down orders by region.", expected_kind: report, expected_query: {metrics: [order_count], dimensions: [dealers.region]}}
- {question: "What is the fraud loss by fraud type?", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [orders.fraud_type]}}
- {question: "How does fraud rate vary by payment method?", expected_kind: report, expected_query: {metrics: [fraud_rate], dimensions: [orders.payment_method]}}
- {question: "Show order value by tenure band.", expected_kind: report, expected_query: {metrics: [order_value], dimensions: [orders.tenure_band]}}
- {question: "How has fraud loss moved month by month?", expected_kind: report, expected_query: {metrics: [fraud_loss], time: {grain: month}}}
- {question: "Show the monthly trend of orders.", expected_kind: report, expected_query: {metrics: [order_count], time: {grain: month}}}
- {question: "What is the monthly fraud rate?", expected_kind: report, expected_query: {metrics: [fraud_rate], time: {grain: month}}}
- {question: "What is the fraud rate in the Telesales channel?", expected_kind: report, expected_query: {metrics: [fraud_rate], filters: [{member: orders.sales_channel, op: eq, values: [Telesales]}]}}
- {question: "How much fraud loss came from the App channel?", expected_kind: report, expected_query: {metrics: [fraud_loss], filters: [{member: orders.sales_channel, op: eq, values: [App]}]}}
- {question: "How many orders came from the East region?", expected_kind: report, expected_query: {metrics: [order_count], filters: [{member: dealers.region, op: eq, values: [East]}]}}
- {question: "What was the fraud loss in 2024?", expected_kind: report, expected_query: {metrics: [fraud_loss], time: {start: "2024-01-01", end: "2025-01-01"}}}
- {question: "How many orders were placed in January 2025?", expected_kind: report, expected_query: {metrics: [order_count], time: {start: "2025-01-01", end: "2025-02-01"}}}
- {question: "Show fraud loss by channel for 2025.", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [orders.sales_channel], time: {start: "2025-01-01", end: "2026-01-01"}}}
- {question: "What is the identity theft loss by region?", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [dealers.region], filters: [{member: orders.fraud_type, op: eq, values: [identity_theft]}]}}
- {question: "Give me the top 3 channels by fraud loss.", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [orders.sales_channel], limit: 3}}
- {question: "Compare fraud rate between Web and App.", expected_kind: report, expected_query: {metrics: [fraud_rate], dimensions: [orders.sales_channel], filters: [{member: orders.sales_channel, op: in, values: [Web, App]}]}}
- {question: "How are we doing on fraud by region?", expected_kind: report, expected_query: {metrics: [fraud_rate], dimensions: [dealers.region]}}
- {question: "Should we review the Partner channel? Show its fraud loss by fraud type.", expected_kind: report, expected_query: {metrics: [fraud_loss], dimensions: [orders.fraud_type], filters: [{member: orders.sales_channel, op: eq, values: [Partner]}]}}
- {question: "How big is the problem by channel?", expected_kind: clarify, expected_query: null}
- {question: "Which channel is the worst?", expected_kind: clarify, expected_query: null}
- {question: "What is the fraud number?", expected_kind: clarify, expected_query: null}
- {question: "What is the profit by store?", expected_kind: out_of_scope, expected_query: null}
- {question: "How many employees work in each region?", expected_kind: out_of_scope, expected_query: null}
- {question: "What is the customer satisfaction score?", expected_kind: out_of_scope, expected_query: null}
- {question: "What will revenue be next year?", expected_kind: out_of_scope, expected_query: null}
