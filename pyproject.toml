[project]
name = "folio"
version = "0.1.0"
description = "Conversational analytics: governed, living HTML reports from business questions"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "duckdb==1.5.4",  # the demo browser test failed on 1.5.6; retest before you raise the pin
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "fastapi>=0.139",
  "uvicorn>=0.50",
  "pyyaml>=6",
  "mcp>=1.29,<2",
  "openai>=2.44,<3",
  "sqlglot>=30,<31",
  "pyarrow>=26,<27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.116"]
google = ["google-genai>=1.75"]
postgres = ["psycopg[binary]>=3.3,<4"]
dev = ["pytest>=8.4", "pytest-asyncio>=1.4", "httpx>=0.28", "ruff"]

[build-system]
requires = ["setuptools>=77"]  # the SPDX license field
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["living_reports*", "folio_graph*"]

[tool.setuptools.package-data]
living_reports = ["*.yaml", "**/*.yaml", "**/*.ts"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["living_reports/web"]

[tool.ruff.lint]
select = ["F", "E9", "I"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]
